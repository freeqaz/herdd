# import-linter contract for Zone P — the dependency DAG of plan §5, made
# executable. Run via tools/vast/test_vastlib_static.py (tools/vast has no CI):
#
#   PYTHONPATH=tools/vast lint-imports --config tools/vast/vastlib/importlinter.ini
#
# lint-imports builds a real import graph, so `vastlib` must be IMPORTABLE when
# it runs — hence the PYTHONPATH. It is passed with --config for the same
# reason mypy.ini is scoped: no repo-wide config file changes behavior for
# anything outside this package.
#
# Plan of record: docs/plans/vast-tooling-refactor-v2.md §5 (architecture) and
# §6 (tooling doctrine).

[importlinter]
root_package = vastlib
include_external_packages = True

[importlinter:contract:vastlib-layers]
name = vastlib rings are strictly downward (plan §5)
type = layers
containers =
    vastlib
layers =
    cli
    supervise : jobs : fleet : workflows
    market : boxes : launch : storage
    core

# Layer order is highest-first: a ring may import anything BELOW it and nothing
# above it. Siblings within a ring are joined with `:` (non-independent), not
# `|` — the plan's rule is about rings, and several within-ring edges are in
# the design already: launch/launch.py picks an offer via market.offers,
# boxes.reap reads price arithmetic, and boxes.health/boxes.salvage read B2
# through storage.b2. Tightening a ring to independent siblings is a later
# ratchet, taken only when the code proves it can hold.
#
# THE DELIMITERS ARE THE OTHER WAY ROUND from what this file said when it was
# written, and the mistake was silent until a real within-ring edge existed.
# Read from `importlinter/contracts/layers.py` (2.13) and confirmed by the
# failure it produced on 2026-08-16 (`vastlib.boxes is not allowed to import
# vastlib.storage`, from boxes/health.py and boxes/salvage.py, both of which
# plan §5 designs):
#     _INDEPENDENT_LAYER_DELIMITER     = "|"   -> siblings may NOT import
#                                                each other
#     _NON_INDEPENDENT_LAYER_DELIMITER = ":"   -> siblings MAY import each other
# A layer may not mix the two. So `|` is the STRICT form and `:` is the loose
# one — the opposite of the intuition that a pipe reads as "or, freely".
#
# The two invariants this contract is really guarding:
#   * `core` imports stdlib + pydantic + Zone S flat leaves only — nothing
#     inside vastlib. It is the bottom layer, so every vastlib import from
#     core is a violation by construction.
#   * NOTHING imports `cli`. It is the top layer and a composition root; the
#     other composition root is fleet.daemon, which is why `fleet` sits in the
#     third ring and not alongside cli.
#
# Not yet expressed here, deliberately:
#   * "Zone S never imports vastlib" — that direction is unreachable from this
#     graph (Zone S is not under the vastlib root package). It is enforced
#     instead by test_jobd_bundle_imports_flat.py, which proves every shipped
#     leaf imports bare-name under `python3 -P` in a flat, repo-invisible
#     directory, and by shipcheck.py's static FLAT_NAMESPACES twin.
#   * an `exhaustive = True` guard on the container. Turn it on once the
#     package stops growing subpackages, so a new ring cannot be added without
#     being placed in the DAG.
