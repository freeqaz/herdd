# mypy config for Zone P ONLY (tools/vast/vastlib).
#
# Why a scoped file instead of [tool.mypy] in the repo pyproject.toml
# -------------------------------------------------------------------
# mypy discovers its config from the CURRENT DIRECTORY (mypy.ini, .mypy.ini,
# pyproject.toml, setup.cfg), not from the tree above the files being checked.
# There is no per-file hierarchy the way ruff has one. So a [tool.mypy] stanza
# in the repo pyproject would apply to EVERY mypy invocation anywhere in the
# repo — and three of the settings this lane needs are global-only:
#
#   * `strict` is not accepted in a per-module [mypy-*] override section, so
#     "strict on vastlib.*" has to be spelled out as its component flags;
#   * `plugins` is global, so the pydantic plugin would load for unrelated
#     runs and hard-fail wherever pydantic is not installed;
#   * `mypy_path` / `explicit_package_bases` change module resolution globally.
#
# The repo has no mypy config today, so "unchanged behavior elsewhere" means
# "still no config at all". Passing --config-file explicitly also makes the
# pytest lane hermetic against a developer's ~/.config/mypy/config.
#
# Enforced by tools/vast/test_vastlib_static.py. Plan: §6 of
# docs/plans/vast-tooling-refactor-v2.md.

[mypy]
python_version = 3.10
plugins = pydantic.mypy

# HOW THE MODULES GET NAMED — this is load-bearing, and it silently broke once.
# The per-module strictness below keys on the module NAME. Invoked the obvious
# way from the repo root (`mypy tools/vast/vastlib`), mypy names the modules
# `tools.vast.vastlib.core` — so `[mypy-vastlib.*]` matches nothing and the
# whole strict block is VACUOUS. Verified 2026-08-16 with a probe: an untyped
# `def probe(x): return x` passed clean.
#
# The lane therefore runs mypy from cwd=tools/vast and asks for the PACKAGE,
# not the path:
#
#     cd tools/vast && mypy --config-file vastlib/mypy.ini -p vastlib
#
# which names the modules `vastlib.*` and makes the block below bite. From any
# other cwd, point MYPYPATH at tools/vast — mypy_path entries are resolved
# against the CURRENT DIRECTORY, not against the config file's directory
# (measured, not assumed: `mypy_path = ..` in this file resolves nowhere useful
# when run from elsewhere).
# test_vastlib_static.py::test_mypy_strictness_is_not_vacuous re-proves the
# block bites, on every run, by type-checking a deliberately untyped probe.
mypy_path = .
explicit_package_bases = True
namespace_packages = True

# Global-only flags (mypy rejects these in a per-module section). Scoped to
# this lane because this file is only ever loaded via --config-file.
warn_redundant_casts = True
warn_unused_configs = False

# Imports are followed and unresolvable ones are errors — the defaults, stated
# because both matter here. Following imports is what lets a bad annotation in
# core/ surface at its call site in supervise/; refusing to ignore missing ones
# is what makes a typo'd module name a failure rather than an `Any`. The Zone S
# flat leaves get an explicit exemption at the bottom of this file instead of a
# blanket waiver.
follow_imports = normal
ignore_missing_imports = False

# `disallow_untyped_calls` is evaluated against the CALLER's options, so a
# per-module `[mypy-<sibling>]` section cannot switch it off for calls INTO an
# unannotated absorbed sibling — measured 2026-08-16 while porting
# boxes/health.py, whose `_fleet_image_states` calls four `imageref` functions.
# `untyped_calls_exclude` is the global-only knob that does it, named per
# module. Keep this list to ABSORBED SIBLINGS still living as flat files (plan
# §3); each name comes off when the sibling lands inside the package, at which
# point the strict block starts biting on it — that is the ratchet, so do not
# add a name here to silence a vastlib module.
untyped_calls_exclude = imageref
# NOT extended to `jobmeta` (2026-08-16, workflows port). `ctl.py` calls ~17
# unannotated Zone S `jobmeta` functions and the one-line fix is tempting —
# but this knob reads the CALLER's options and applies package-wide, and
# `workflows/matrix.py` had already silenced its own `jobmeta` calls with
# per-call `# type: ignore[no-untyped-call]`. Adding the module here turned all
# nine of those into `unused-ignore` errors, i.e. it broke a sibling module to
# save typing in this one. `ctl.py` therefore carries per-call ignores too,
# same as the `disksize` sites below. Same reasoning for `workflow`.

# --- global default: permissive -------------------------------------------
# Nothing outside vastlib is checked by this config in practice (the lane
# passes tools/vast/vastlib as the only path), but keeping the global section
# permissive means a stray import pulled in by follow_imports does not fail
# the lane on code this branch has not ported yet.
strict = False

# --- Zone P: strict --------------------------------------------------------
# `strict` expanded flag-by-flag, because mypy rejects the `strict` shorthand
# in a per-module section. This is the mypy 2.x --strict set minus the two
# global-only members (warn_unused_configs, warn_redundant_casts), which are
# handled above. Adding a flag here later is a deliberate ratchet.
[mypy-vastlib,vastlib.*]
disallow_any_generics = True
disallow_subclassing_any = True
disallow_untyped_calls = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
warn_unused_ignores = True
warn_return_any = True
no_implicit_reexport = True
strict_equality = True
extra_checks = True

# Zone S flat leaves (plan §3) have no stubs and no annotations. vastlib
# imports them BARE-NAME, so mypy sees `import bidpolicy` with nothing to
# resolve until one is actually imported. Sections are pre-declared here so the
# first port does not trip on them; `warn_unused_configs` is off above
# precisely because these are expected to sit unused for now.
[mypy-bidpolicy,runmeta,jobmeta,ladder_core,metrics_probe,gemm_probe,parse_vllm_mem,triton_cache]
ignore_missing_imports = True
follow_untyped_imports = True
# `ignore_errors` added 2026-08-16 by the first port that actually imports one
# of these (supervise/journal.py -> runmeta, jobmeta). mypy_path finds them as
# local sources, so following the import type-checks their BODIES: `import
# jobmeta` alone produced 17 errors in jobmeta.py and the lane went red on code
# this refactor is contractually forbidden to touch (Zone S is unchanged by
# construction, plan §3). Types are still read from them — follow is left ON,
# so a wrong argument at a vastlib call site is still caught; only diagnostics
# *inside* the Zone S file are suppressed. Do NOT extend this to any vastlib
# module.
ignore_errors = True

# Absorbed siblings reached TRANSITIVELY from Zone S, not by vastlib itself
# (jobmeta imports vram_facts inside `_job_vram_floor`). Same reasoning as
# above: their diagnostics are pre-existing and out of scope for this branch.
# Each one moves into the package on its own port step, at which point it is
# `vastlib.*` and this section stops matching it.
[mypy-vram_facts]
ignore_errors = True
follow_untyped_imports = True

# Absorbed siblings imported DIRECTLY by a vastlib module during the add-only
# phase, while they are still flat files at tools/vast/<name>.py (plan §3:
# "their flat files become deprecation shims for one release, then deleted").
# `imageref` — added 2026-08-16 by boxes/health.py, whose `_fleet_image_states`
# calls IMAGE_DIGEST_ENV / _split_image / resolve_tag_digest_ttl /
# classify_image_staleness. Same reasoning as the two sections above: its
# diagnostics are pre-existing and out of scope for this branch. The companion
# half — silencing the CALL SITES in health.py — is the global
# `untyped_calls_exclude` above, because that flag reads the caller's options.
# When the sibling lands inside the package it is named `vastlib.*`, this
# section stops matching it, and the strict block starts biting on it instead.
[mypy-imageref]
ignore_missing_imports = True
follow_untyped_imports = True
ignore_errors = True

# `parked_lifecycle` — added 2026-08-16 by boxes/reap.py, which imports it
# FUNCTION-LOCALLY in `_reap_durability_advisory` and `cmd_reap` (verbatim: the
# local import is what keeps the sibling's own import of `herdd` from being a
# cycle at runtime). mypy has no such scruple: it follows the local import, and
# through it `workflowctl` -> `workflowmeta` / `shipcheck` / `gpu_rates` /
# `vastconf` / `herdd.py` itself — 80+ pre-existing diagnostics from five
# unported flat files this branch is contractually forbidden to touch, plus a
# 20k-line parse on every lane run. `follow_imports = skip` (rather than the
# `ignore_errors` used for Zone S above) is the one setting that stops the
# TRANSITIVE walk as well as the diagnostics; the sibling becomes `Any`, so its
# call sites need no `untyped_calls_exclude` entry either. When it lands inside
# the package it is named `vastlib.*`, this section stops matching, and the
# strict block starts biting on it.
[mypy-parked_lifecycle]
ignore_missing_imports = True
follow_imports = skip

# `train_rates` joined them 2026-08-28 at the same seam: `_train_rate_soft`
# imports it function-locally and for the same contract (optional module,
# absence is a first-class None), and `replacement.py` annotates against its
# `Family` / `RateEstimate` under TYPE_CHECKING so the rate seam is typed. Its
# own body carries pre-existing diagnostics that belong to its author.
#
# `gpu_rates` / `disksize` — added 2026-08-16 by supervise/replacement.py.
# `_gpu_rate_soft` imports `gpu_rates` FUNCTION-LOCALLY and verbatim (the lazy
# import is the contract: the module is optional, and its absence is a
# first-class None, never a zero), and `_replacement_disk_need` /
# `_launch_job_understudy` call `disksize`. Both are absorbed siblings (plan §3)
# still living as flat files, so mypy resolves them as local sources and
# type-checks their BODIES: `gpu_rates.py` alone contributes one pre-existing
# `union-attr` this branch is contractually forbidden to fix. Same reasoning,
# and the same ratchet, as the Zone S and `imageref` sections above — types are
# still read from them (follow is ON), so a wrong argument at a vastlib call
# site is still caught; only diagnostics INSIDE the sibling are suppressed. The
# untyped `disksize` CALL sites carry per-call `# type: ignore[no-untyped-call]`
# rather than a global `untyped_calls_exclude` entry, because that flag reads
# the caller's options and would silence every untyped call in the module.
[mypy-gpu_rates,disksize,train_rates]
ignore_missing_imports = True
follow_untyped_imports = True
ignore_errors = True

# `shipcheck` — added 2026-08-16 by jobs/bundle.py, whose `_jobd_import_gate`
# imports it FUNCTION-LOCALLY and bare-name (verbatim: the local import, and
# the `sys.path.insert` in front of it, are what make the gate resolvable from
# a caller that did not bootstrap `tools/vast`; both sit inside the gate's
# blanket `except Exception`, so a port that dropped them would turn the
# fail-closed gate into a permanent one-line NOTE). mypy resolves it as a local
# source and type-checks its BODY: six pre-existing diagnostics in a flat file
# this branch is contractually forbidden to touch. Same reasoning and the same
# ratchet as the Zone S / `imageref` / `gpu_rates` sections above — follow is
# left ON, so a wrong argument at the vastlib call site is still caught; only
# diagnostics INSIDE `shipcheck.py` are suppressed. It is an absorbed sibling
# only in the sense that step 6 repoints its `spec_from_file_location` target;
# the file itself stays.
[mypy-shipcheck]
ignore_missing_imports = True
follow_untyped_imports = True
ignore_errors = True

# `notify` — added 2026-08-16 by fleet/daemon.py, whose three notification
# methods call `poll` / `is_gone` / `journal_fields` / `retain_outbid` /
# `outbid_evidence_rows` and read `INBOX_PATH` / `POLL_ERROR_EVENT` /
# `GAP_EVENT` / `SEEN_EVENT` / `WINDOW`. It is a pure flat leaf that fleetd
# imports BARE-NAME and it is deliberately NOT absorbed into the package (plan
# §3 lists neither it nor a Zone S home for it, and leaving it flat is the
# lower-risk answer while both fleetd.py and vastlib import it). Same reasoning
# and the same ratchet as the sections above: follow is left ON so a wrong
# argument at a vastlib call site is still caught; only diagnostics inside
# `notify.py` are suppressed.
#
# NOT in `untyped_calls_exclude`, deliberately: `supervise/job_lane.py` already
# carries PER-CALL `# type: ignore[no-untyped-call]` on its two `notify.*` call
# sites, and a global exclusion turns exactly those into `unused-ignore` errors
# (measured 2026-08-16 — it went red in a module this port does not touch).
# One convention per seam: per-call ignores, at every notify call site.
[mypy-notify]
ignore_missing_imports = True
follow_untyped_imports = True
ignore_errors = True

# `serve_artifact` + `modelkit.*` — added 2026-08-24 by cli/fleet/watch.py,
# whose `--expect-ident` verification recomposes the identity expectation
# through `serve_artifact.compose_expectation` (the same composer
# `launch_serve.sh` runs, which is the whole point: one reading of the
# registry). mypy follows it into `modelkit/`, whose modules import each other
# BARE-NAME after a `sys.path` insert — self-contained by contract, so they can
# be staged onto a box one file at a time — which mypy reports as
# import-not-found, plus four pre-existing diagnostics this branch is
# contractually forbidden to touch. Same reasoning and the same ratchet as the
# sections above: follow is left ON, so a wrong argument at the vastlib call
# site is still caught; only diagnostics INSIDE these files are suppressed.
[mypy-serve_artifact,modelkit,modelkit.*]
ignore_missing_imports = True
follow_untyped_imports = True
ignore_errors = True
